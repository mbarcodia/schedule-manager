# Planner subscription-token relay. Not a public web app — only the
# Next.js deployment calls it, authenticated by PLANNER_RELAY_SECRET — so
# it has no http_service block (no browser traffic, no auto-TLS routing
# needed for that). Scale-to-zero: the machine stops between planner
# turns and wakes in ~1-2s on the next request — negligible against a
# turn's 10-60s runtime and the 300s Vercel budget, and it keeps the Fly
# bill at storage-only pennies while idle.
app = "schedule-manager-planner-relay"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.relay"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true
