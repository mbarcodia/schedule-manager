# Planner subscription-token relay. Not a public web app — only Vercel
# calls it, authenticated by PLANNER_RELAY_SECRET — so it has no
# http_service block (no browser traffic, no auto-TLS routing needed for
# that). One small always-on machine: planner turns can run tens of
# seconds, and a cold-started Fly machine on top of that would compound
# the Vercel-side maxDuration budget.
app = "schedule-manager-planner-relay"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.relay"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true
