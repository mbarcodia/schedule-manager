# Hourly trigger for the push-notification digest routes. Vercel Hobby crons
# are capped at 2 jobs / once daily, so the any-hour digest matching
# (eod-checkin + weekly-summary check each user's chosen local hour) is
# driven from here instead — see src/lib/notifications/time-match.ts.
name: Notification digests

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest routes for the current UTC hour
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PLANNER_RELAY_URL: ${{ secrets.PLANNER_RELAY_URL }}
        run: |
          H=$(date -u +%-H)
          fail=0
          # Only the digest routes read ?hour=; the rest compare their own
          # moments against the clock. The extra param is harmless, so one loop
          # covers all five routes.
          for route in eod-checkin weekly-summary reminders grace-reminders list-chase; do
            status=$(curl -s -o /tmp/resp.json -w "%{http_code}" --max-time 120 \
              "$BASE_URL/api/cron/$route?hour=$H" \
              -H "Authorization: Bearer $CRON_SECRET")
            if [ "$status" != "200" ]; then
              echo "::error::$route returned HTTP $status"
              cat /tmp/resp.json
              fail=1
            fi
          done

          # The Fly relay bundles its own copy of the app's data layer, so any
          # migration that changes tables breaks it the moment it's applied —
          # while the Vercel deployment looks fine. /health runs the same row
          # fetch a chat turn does, so a relay that wasn't redeployed fails here
          # instead of silently killing every chat turn. Skipped when the URL
          # isn't configured (deployments using an API key have no relay).
          if [ -n "$PLANNER_RELAY_URL" ]; then
            status=$(curl -s -o /tmp/relay.json -w "%{http_code}" --max-time 120 "$PLANNER_RELAY_URL/health")
            if [ "$status" != "200" ]; then
              echo "::error::planner relay health check returned HTTP $status — it may need redeploying (flyctl deploy)"
              cat /tmp/relay.json
              fail=1
            fi
          fi
          exit $fail

      # Fires only when the step above failed. Uses ALERT_SECRET (not
      # CRON_SECRET) so the alert still reaches the app even when
      # CRON_SECRET itself is the thing that's out of sync — see
      # CRON_SECRET_RUNBOOK.md for what to do when this notification lands.
      - name: Alert via app push if cron auth is broken
        if: failure()
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: |
          curl -fsS --max-time 30 "$BASE_URL/api/cron/alert-drift" \
            -H "Authorization: Bearer $ALERT_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"reason":"digest cron routes returned a non-200 response"}'
